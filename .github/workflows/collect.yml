name: Collect trends

# cron 은 UTC 기준. 06:17 KST = 21:17 UTC(전날), 18:17 KST = 09:17 UTC. (정각 혼잡을 피해 17분)
on:
  schedule:
    - cron: "17 21 * * *"
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      skip:
        description: "건너뛸 수집기 (공백 구분: naver tour google_trending google_youtube)"
        required: false
        default: ""

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 수집·병합 (키는 Secrets → 환경변수로만 전달)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          TOUR_RLTE_KEY: ${{ secrets.TOUR_RLTE_KEY }}
          # A-2 는 기본으로 수집해 두고, 화면의 '신규 발견 포함' 체크박스로 보이기/숨기기를 고른다.
          # 수집 자체를 끄려면 저장소 변수 USE_DATALAB_WEB_RANK=false (Settings > Secrets and variables > Actions > Variables)
          USE_DATALAB_WEB_RANK: ${{ vars.USE_DATALAB_WEB_RANK || 'true' }}
          SKIP: ${{ github.event.inputs.skip }}
        run: python scripts/build_data.py --skip $SKIP

      - name: 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "data: 트렌드 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M KST')"
            for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break || sleep 5; done
          fi

  deploy:
    needs: collect
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
